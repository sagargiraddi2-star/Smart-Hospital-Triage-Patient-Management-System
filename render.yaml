# Render Blueprint for TRIORA (Phase 10).
# One free web service: the Express backend also serves the built React
# frontend, so the website and the API share one address.
#
# No secrets are stored in this file:
# - DATABASE_URL is entered privately in the Render dashboard (sync: false).
#   It must be the connection string of the separate Neon "production"
#   branch, NOT the local development database.
# - SESSION_SECRET is generated by Render.
services:
  - type: web
    name: triora
    runtime: node
    plan: free
    region: singapore # same region as the Neon database (ap-southeast-1)
    branch: claude-development
    autoDeploy: true
    # --include=dev is needed because NODE_ENV=production would otherwise
    # skip Vite, which is a development dependency used for the build.
    buildCommand: npm ci --include=dev --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
