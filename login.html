
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | TRIORA</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">

            <header class="login-header">
                <div class="brand-name">TRIORA</div>
                <p class="brand-description">Smart Hospital Triage</p>
            </header>

            <div class="login-intro">
                <h1 id="login-title">Welcome back</h1>
                <p>Sign in to your hospital staff account.</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Work email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@hospital.com"
                        autocomplete="username"
                        required
                    >
                    <small class="error-message" id="emailError"></small>
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#" id="forgotLink">Forgot password?</a>
                    </div>

                    <div class="password-input">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>

                    <small class="error-message" id="passwordError"></small>
                </div>

                <p id="formMessage" class="form-message" role="status"></p>

                <button type="submit" id="signInButton" class="sign-in-button">
                    Sign in
                </button>

            </form>

            <footer class="login-footer">
                <p>Authorized hospital staff only</p>
                <p>Need access? Contact your hospital administrator.</p>
            </footer>

        </section>
    </main>
</body>
</html>
